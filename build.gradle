plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.0'
}

group = 'BytecodeVM'
version = '2.2.3'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':sdk')
    implementation 'info.picocli:picocli:4.7.7'
    implementation 'com.google.code.gson:gson:2.14.0'

    implementation 'org.ow2.asm:asm:9.7'
    implementation 'org.ow2.asm:asm-commons:9.7'
    implementation 'org.ow2.asm:asm-analysis:9.7'
    implementation 'org.ow2.asm:asm-tree:9.7'
    implementation 'org.ow2.asm:asm-util:9.7'

    compileOnly("org.projectlombok:lombok:1.18.46")
    annotationProcessor("org.projectlombok:lombok:1.18.46")

    implementation 'org.yaml:snakeyaml:2.6'

    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'ch.qos.logback:logback-classic:1.5.18'
}

def generatedVersionSources = layout.buildDirectory.dir('generated/sources/version/java')

tasks.register('generateBuildInfo') {
    inputs.property('projectVersion', project.version.toString())
    outputs.dir(generatedVersionSources)

    doLast {
        def output = generatedVersionSources.get().file('nhcm/bytecodevm/BuildInfo.java').asFile
        output.parentFile.mkdirs()
        def escapedVersion = project.version.toString()
                .replace('\\', '\\\\')
                .replace('"', '\\"')
        output.text = """package nhcm.bytecodevm;

/** Generated by Gradle from the project version. */
public final class BuildInfo
{
    public static final String VERSION = \"${escapedVersion}\";

    private BuildInfo()
    {
    }
}
"""
    }
}

sourceSets.main.java.srcDir(generatedVersionSources)
tasks.named('compileJava').configure {
    dependsOn tasks.named('generateBuildInfo')
}

jar {
    manifest {
        attributes(
                'Main-Class': 'nhcm.bytecodevm.BytecodeVM'
        )
    }
}

shadowJar {
    archiveClassifier.set('')
}
